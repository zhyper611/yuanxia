name: 问题反馈
description: 报告使用原匣时遇到的问题
title: "[问题] "
body:
  - type: input
    id: version
    attributes:
      label: 原匣版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 实际发生了什么？你期待发生什么？
    validations:
      required: true
